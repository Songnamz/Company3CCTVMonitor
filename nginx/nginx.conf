worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    client_max_body_size 1m;

    # Docker's embedded DNS; re-resolve so container restarts don't break proxying.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Everything is behind a login: never let Cloudflare's edge cache a response
    # (it caches .jpg/.js by default when no Cache-Control is present).
    map $upstream_http_cache_control $cache_control {
        ""      "private, no-cache";
        default $upstream_http_cache_control;
    }

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_user_agent" cf=$http_cf_connecting_ip rt=$request_time';
    access_log /dev/stdout main;

    server {
        listen 80;

        set $app    http://app:8000;
        set $go2rtc http://go2rtc:1984;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_hide_header Cache-Control;
        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;

        # Login check for the go2rtc paths (the app enforces login on its own routes).
        location = /_auth {
            internal;
            proxy_pass $app/api/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        # --- go2rtc: only the MSE websocket and the player scripts, and only when logged in ---
        location = /stream/api/ws {
            auth_request /_auth;
            proxy_pass $go2rtc/api/ws$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
        }
        # The live player scripts load one after the other before any camera can start, so
        # let the browser keep them for a day instead of fetching them on every page load.
        # (add_header here replaces the server-level ones, hence repeated.)
        location = /stream/video-stream.js {
            auth_request /_auth;
            proxy_pass $go2rtc/video-stream.js;
            add_header Cache-Control "private, max-age=86400" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
        }
        location = /stream/video-rtc.js {
            auth_request /_auth;
            proxy_pass $go2rtc/video-rtc.js;
            add_header Cache-Control "private, max-age=86400" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
        }
        location /stream/ {
            return 403;
        }
        location = /stream {
            return 403;
        }

        # --- app ---
        # Detector -> app only (inside the compose network), never from outside.
        location /internal/ {
            return 404;
        }

        location = /api/live {
            proxy_pass $app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 24h;
        }

        location /snapshots/ {
            proxy_pass $app;
            # Browser may cache (files never change), shared caches may not.
            add_header Cache-Control "private, max-age=2592000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
        }

        location / {
            proxy_pass $app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
